name: Build and deploy Hugo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website and app docs
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.POPPET_SOURCE_TOKEN || github.token }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Hugo
        uses: jdx/mise-action@v4
        with:
          version: 2026.10.12
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: mise exec -- hugo --gc --minify --panicOnWarning --baseURL "$PAGES_BASE_URL/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
